name: Bug Report
description: File a bug report to help us improve ZeroCAC
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: ZeroCAC Version
      description: What version of ZeroCAC are you running?
      placeholder: e.g., 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run `zerocac analyze https://example.com`
        2. Select provider 'openai'
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please copy and paste any relevant terminal output or tracebacks.
      render: shell
