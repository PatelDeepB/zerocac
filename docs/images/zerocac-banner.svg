<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="460" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="92" x2="1200" y2="92" />
    <line x1="0" y1="184" x2="1200" y2="184" />
    <line x1="0" y1="276" x2="1200" y2="276" />
    <line x1="0" y1="368" x2="1200" y2="368" />
    <line x1="300" y1="0" x2="300" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
    <line x1="900" y1="0" x2="900" y2="460" />
  </g>

  <!-- Top Hero Header -->
  <g transform="translate(60, 50)">
    <!-- Badge -->
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="95" y="18" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">ZERO AD SPEND AUTOPILOT</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#primaryGrad)" font-family="'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">ZeroCAC</text>
    <text x="210" y="68" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="28" font-weight="700">Autonomous Organic AI Marketing Agent</text>
    <text x="0" y="105" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16" font-weight="400">Scale products to $0 Customer Acquisition Cost through permanent, compounding distribution</text>
  </g>

  <!-- 3 Flow Architecture Columns -->
  <!-- Col 1: Product Ingestion & Frontier Models -->
  <g transform="translate(60, 190)">
    <rect width="330" height="220" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#10b981" fill-opacity="0.2" />
    <text x="28" y="35" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="50" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Intelligence & Positioning</text>

    <!-- Content Items -->
    <rect x="20" y="60" width="290" height="38" rx="6" fill="#090d16" stroke="#1e293b" />
    <text x="32" y="83" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">URL Scraper & DOM Extractor</text>

    <rect x="20" y="108" width="290" height="38" rx="6" fill="#090d16" stroke="#1e293b" />
    <text x="32" y="131" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">ICP Personas & Competitor Gaps</text>

    <rect x="20" y="156" width="290" height="42" rx="6" fill="#090d16" stroke="#10b981" stroke-opacity="0.4" />
    <text x="32" y="181" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">OpenAI GPT-6 • Gemini 4 • Claude 5.5</text>
  </g>

  <!-- Flow Connector 1 -->
  <g transform="translate(400, 290)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="30,-5 40,0 30,5" fill="#10b981" />
  </g>

  <!-- Col 2: The 4 Organic Engines -->
  <g transform="translate(450, 190)">
    <rect width="330" height="220" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#06b6d4" fill-opacity="0.2" />
    <text x="28" y="35" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="50" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="600">The 4 Organic Growth Engines</text>

    <rect x="20" y="58" width="290" height="32" rx="6" fill="#090d16" />
    <text x="30" y="79" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">🎯 Intent Sniper (Reddit / HN / X)</text>

    <rect x="20" y="96" width="290" height="32" rx="6" fill="#090d16" />
    <text x="30" y="117" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="12" font-weight="600">🔍 AEO & GEO (SearchGPT / Perplexity)</text>

    <rect x="20" y="134" width="290" height="32" rx="6" fill="#090d16" />
    <text x="30" y="155" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="12" font-weight="600">⚡ Viral Threads & 60s Video Scripts</text>

    <rect x="20" y="172" width="290" height="32" rx="6" fill="#090d16" />
    <text x="30" y="193" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600">🚀 100+ Free Directory Multiplier</text>
  </g>

  <!-- Flow Connector 2 -->
  <g transform="translate(790, 290)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="30,-5 40,0 30,5" fill="#6366f1" />
  </g>

  <!-- Col 3: Compounding Outcome & Metrics -->
  <g transform="translate(840, 190)">
    <rect width="300" height="220" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#6366f1" fill-opacity="0.2" />
    <text x="28" y="35" fill="#6366f1" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="50" y="35" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Compounding Equity</text>

    <g transform="translate(20, 60)">
      <text x="0" y="18" fill="#10b981" font-family="'Inter', sans-serif" font-size="24" font-weight="800">$0</text>
      <text x="45" y="16" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Ad Spend (Zero Token Burn)</text>

      <text x="0" y="60" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="24" font-weight="800">15-30%</text>
      <text x="95" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Intent Solution Conversion</text>

      <text x="0" y="102" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Permanent</text>
      <text x="135" y="100" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Indexed Assets (Never Expire)</text>

      <rect x="0" y="125" width="260" height="26" rx="4" fill="#6366f1" fill-opacity="0.15" />
      <text x="130" y="142" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Kills Google & Meta Ad Overheads</text>
    </g>
  </g>
</svg>
